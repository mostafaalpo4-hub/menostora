<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة السلطان | بوابة الدفع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glass-card p-6 rounded-3xl shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">منصة السلطان - دفع آمن</h2>
        
        <!-- حقل الرقم المحول له -->
        <div class="mb-6 p-4 bg-gray-900 rounded-xl border border-gray-700">
            <label class="block text-xs text-gray-400 mb-2">الرقم المحول له (Copy to clipboard):</label>
            <div class="flex items-center justify-between">
                <span id="walletNumber" class="text-xl font-mono font-bold text-white tracking-wider">01117841772</span>
                <button onclick="copyToClipboard()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded-lg text-sm transition">نسخ</button>
            </div>
        </div>

        <form id="paymentForm" class="space-y-4">
            <!-- طرق الدفع -->
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer border border-gray-700 rounded-xl p-2 flex justify-center hover:border-blue-500 transition-all"><input type="radio" name="method" value="Vodafone" class="hidden" checked><img src="https://i.ibb.co/9mVrd77C/1783569777780.png" class="h-8"></label>
                <label class="cursor-pointer border border-gray-700 rounded-xl p-2 flex justify-center hover:border-blue-500 transition-all"><input type="radio" name="method" value="Etisalat" class="hidden"><img src="https://i.ibb.co/MkQxZrcr/1783569858025.png" class="h-8"></label>
            </div>

            <input type="number" id="amount" placeholder="المبلغ (EGP) / Amount" required class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700 focus:border-blue-500 outline-none">
            <input type="tel" id="phone" placeholder="رقم هاتفك / Your Phone" required class="w-full bg-gray-900 p-3 rounded-xl border border-gray-700 focus:border-blue-500 outline-none">
            
            <label class="block text-sm text-gray-400">صورة التحويل / Transfer Screenshot:</label>
            <input type="file" id="screenshot" accept="image/*" class="w-full text-sm text-gray-400 file:bg-blue-600 file:text-white file:rounded-full file:border-0 file:px-4 file:py-2 cursor-pointer">

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold transition-all">تأكيد الدفع / Confirm Payment</button>
        </form>

        <div id="statusMsg" class="hidden mt-4 text-center text-blue-400 font-medium"></div>
    </div>

    <script>
        // خاصية النسخ
        function copyToClipboard() {
            const text = document.getElementById('walletNumber').innerText;
            navigator.clipboard.writeText(text);
            alert("تم نسخ الرقم: " + text);
        }

        // إرسال البيانات للبوت
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');
            
            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            const BOT_TOKEN = "8608199060:AAEUhYKVr1TgnMZzLcdAzmCShgaZZcQ1KZA";
            const CHAT_IDS = ["8997106548", "1203957018"];
            
            const amount = document.getElementById('amount').value;
            const phone = document.getElementById('phone').value;
            const method = document.querySelector('input[name="method"]:checked').value;
            
            const message = `💰 طلب دفع جديد - منصة السلطان\n\nالمبلغ: ${amount} EGP\nرقم الهاتف: ${phone}\nطريقة الدفع: ${method}\n\nStatus: Pending / جاري المعالجة`;

            try {
                for (const id of CHAT_IDS) {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: id, text: message })
                    });
                }
                
                status.innerHTML = "تم إرسال طلبك بنجاح، جاري المعالجة.<br>Request submitted, being processed.";
                status.classList.remove('hidden');
                document.getElementById('paymentForm').reset();
            } catch (error) {
                status.innerHTML = "حدث خطأ في الاتصال.";
                status.classList.replace('text-blue-400', 'text-red-400');
                status.classList.remove('hidden');
            } finally {
                btn.innerText = "تأكيد الدفع / Confirm Payment";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
