<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mino Stora - Earnings Withdrawal Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1f2937;
            --focus-ring: rgba(99, 102, 241, 0.4);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        body[dir="rtl"] {
            font-family: 'Cairo', sans-serif;
        }

        /* Ambient Glow Background Effects */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }
        .glow-1 { top: -80px; left: -80px; }
        .glow-2 { bottom: -80px; right: -80px; }

        /* Fixed Top Language Switcher Bar */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        body[dir="rtl"] .top-bar {
            right: auto;
            left: 20px;
        }

        .lang-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .lang-btn:hover {
            border-color: var(--primary-color);
            background-color: var(--input-bg);
        }

        /* Main Container Card */
        .portal-container {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
        }

        .portal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .portal-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .portal-header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        body[dir="rtl"] .form-label {
            text-align: right;
        }

        /* Withdrawal Type Selection Cards (Grid of 3) */
        .type-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .type-option {
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .type-option img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 4px;
        }

        .type-option:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        .type-option.active {
            border-color: var(--primary-color);
            background-color: rgba(99, 102, 241, 0.08);
            color: var(--text-main);
        }

        /* Input Fields */
        .form-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        body[dir="rtl"] .form-input {
            text-align: right;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .dynamic-field {
            display: none;
        }

        .dynamic-field.visible {
            display: block;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Simple Text Notification */
        .notification-banner {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .notification-banner.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
    </style>
</head>
<body lang="en" dir="ltr">

    <!-- Ambient Glow Orbs -->
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>

    <!-- Fixed Top Language Switcher Bar -->
    <div class="top-bar">
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">العربية</button>
    </div>

    <!-- Main Withdrawal Portal Card -->
    <div class="portal-container">
        <div class="portal-header">
            <h1 id="portalTitle">Mino Stora</h1>
            <p id="portalSubtitle">Earnings Withdrawal Portal</p>
        </div>

        <form id="withdrawalForm" onsubmit="handleWithdrawal(event)">
            <!-- Step 1: Choose Withdrawal Type -->
            <div class="form-group">
                <label class="form-label" id="labelType">Withdrawal Type</label>
                <div class="type-selector">
                    <div class="type-option active" id="typeTelegram" onclick="selectType('telegram')">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-2.01 1.28-5.68 3.77-.54.37-1.03.55-1.47.54-.48-.01-1.4-.27-2.08-.49-.84-.27-1.51-.42-1.45-.89.03-.25.38-.51 1.08-.78 4.23-1.84 7.05-3.05 8.46-3.64 4.03-1.69 4.87-1.98 5.41-1.99.12 0 .39.03.57.18.15.12.19.28.21.4-.02.07-.02.2-.04.37z"/></svg>
                        <span id="textTelegramOption">Telegram Stars</span>
                    </div>
                    <div class="type-option" id="typeCash" onclick="selectType('cash')">
                        <img src="https://i.ibb.co/9mVrd77C/1783569777780.png" alt="Vodafone">
                        <span id="textCashOption">Egyptian Cash</span>
                    </div>
                    <div class="type-option" id="typeTon" onclick="selectType('ton')">
                        <img src="https://i.ibb.co/spL7PLKb/1784694766692.png" alt="TON">
                        <span id="textTonOption">TON Payment</span>
                    </div>
                </div>
            </div>

            <!-- Step 2A: Telegram Stars (Username + Min 50) -->
            <div id="telegramFieldGroup" class="form-group dynamic-field visible">
                <label class="form-label" id="labelTelegram">Telegram Username (Min. 50 Stars)</label>
                <input type="text" id="telegramUsername" class="form-input" placeholder="@username" value="@">
            </div>

            <!-- Step 2B: Egyptian Cash (Wallet Number + Telegram Username + Min 50 EGP) -->
            <div id="cashFieldGroup" class="form-group dynamic-field">
                <div style="margin-bottom: 14px;">
                    <label class="form-label" id="labelCashWallet">Wallet Number (Min. 50 EGP)</label>
                    <input type="tel" id="cashWallet" class="form-input" placeholder="010XXXXXXXX">
                </div>
                <div>
                    <label class="form-label" id="labelCashTelegram">Telegram Username</label>
                    <input type="text" id="cashTelegram" class="form-input" placeholder="@username" value="@">
                </div>
            </div>

            <!-- Step 2C: TON Payment (Telegram Username + Wallet Address + Min 1 TON) -->
            <div id="tonFieldGroup" class="form-group dynamic-field">
                <div style="margin-bottom: 14px;">
                    <label class="form-label" id="labelTonTelegram">Telegram Username</label>
                    <input type="text" id="tonTelegram" class="form-input" placeholder="@username" value="@">
                </div>
                <div>
                    <label class="form-label" id="labelTonWallet">TON Wallet Address</label>
                    <input type="text" id="tonWallet" class="form-input" placeholder="Enter your TON wallet address">
                </div>
            </div>

            <!-- Step 3: Withdrawal Amount -->
            <div class="form-group">
                <label class="form-label" id="labelAmount">Withdrawal Amount (Min. 1 for TON, 50 for others)</label>
                <input type="number" id="withdrawalAmount" class="form-input" placeholder="Enter amount" min="1" step="any" required>
            </div>

            <!-- Step 4: Submit Button -->
            <button type="submit" id="submitBtn" class="submit-btn">Confirm Withdrawal Request</button>

            <!-- Simple Text Notification -->
            <div id="statusNotification" class="notification-banner"></div>
        </form>
    </div>

    <script>
        const translations = {
            en: {
                dir: "ltr",
                langToggleBtnText: "العربية",
                portalTitle: "Mino Stora",
                portalSubtitle: "Earnings Withdrawal Portal",
                labelType: "Withdrawal Type",
                textTelegramOption: "Telegram Stars",
                textCashOption: "Egyptian Cash",
                textTonOption: "TON Payment",
                labelTelegram: "Telegram Username (Min. 50 Stars)",
                telegramPlaceholder: "@username",
                labelCashWallet: "Wallet Number (Min. 50 EGP)",
                cashWalletPlaceholder: "010XXXXXXXX",
                labelCashTelegram: "Telegram Username",
                cashTelegramPlaceholder: "@username",
                labelTonTelegram: "Telegram Username",
                tonTelegramPlaceholder: "@username",
                labelTonWallet: "TON Wallet Address",
                tonWalletPlaceholder: "Enter your TON wallet address",
                labelAmount: "Withdrawal Amount (Min. 1 for TON, 50 for others)",
                amountPlaceholder: "Enter amount",
                submitBtn: "Confirm Withdrawal Request",
                successText: "Withdrawal request submitted successfully.",
                errorTextTelegram: "Please provide a valid Telegram username and a minimum amount of 50 stars.",
                errorTextCash: "Please provide a valid wallet number, Telegram username, and a minimum amount of 50 EGP.",
                errorTextTon: "Please provide a valid Telegram username, TON wallet address, and a minimum amount of 1.",
                errorGeneral: "Please fill in all required fields properly."
            },
            ar: {
                dir: "rtl",
                langToggleBtnText: "English",
                portalTitle: "مينو ستورا",
                portalSubtitle: "بوابة سحب الأرباح",
                labelType: "طريقة السحب",
                textTelegramOption: "نجوم تيليجرام",
                textCashOption: "كاش مصري",
                textTonOption: "دفع TON",
                labelTelegram: "معرف تيليجرام (الحد الأدنى 50 نجمة)",
                telegramPlaceholder: "@username",
                labelCashWallet: "رقم المحفظة (الحد الأدنى 50 جنيه)",
                cashWalletPlaceholder: "010XXXXXXXX",
                labelCashTelegram: "معرف تيليجرام",
                cashTelegramPlaceholder: "@username",
                labelTonTelegram: "معرف تيليجرام",
                tonTelegramPlaceholder: "@username",
                labelTonWallet: "عنوان محفظة TON",
                tonWalletPlaceholder: "أدخل عنوان محفظة TON الخاصة بك",
                labelAmount: "مبلغ السحب (الحد الأدنى 1 لـ TON، و50 للباقي)",
                amountPlaceholder: "أدخل المبلغ",
                submitBtn: "تأكيد طلب السحب",
                successText: "تم إرسال طلب السحب بنجاح.",
                errorTextTelegram: "يرجى إدخال معرف تيليجرام صحيح ومبلغ لا يقل عن 50 نجمة.",
                errorTextCash: "يرجى إدخال رقم محفظة ومعرف تيليجرام ومبلغ لا يقل عن 50 جنيه مصري.",
                errorTextTon: "يرجى إدخال معرف تيليجرام وعنوان محفظة TON ومبلغ لا يقل عن 1.",
                errorGeneral: "يرجى تعبئة كافة الحقول المطلوبة بشكل صحيح."
            }
        };

        function toggleLanguage() {
            const htmlTag = document.documentElement;
            const currentLang = htmlTag.getAttribute('lang') || 'en';
            if (currentLang === 'en') {
                applyLanguage('ar');
            } else {
                applyLanguage('en');
            }
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            const htmlTag = document.documentElement;

            htmlTag.setAttribute('lang', lang);
            htmlTag.setAttribute('dir', t.dir);
            document.body.setAttribute('dir', t.dir);

            document.getElementById('langToggleBtn').innerText = t.langToggleBtnText;
            document.getElementById('portalTitle').innerText = t.portalTitle;
            document.getElementById('portalSubtitle').innerText = t.portalSubtitle;
            document.getElementById('labelType').innerText = t.labelType;
            document.getElementById('textTelegramOption').innerText = t.textTelegramOption;
            document.getElementById('textCashOption').innerText = t.textCashOption;
            document.getElementById('textTonOption').innerText = t.textTonOption;
            document.getElementById('labelTelegram').innerText = t.labelTelegram;
            document.getElementById('telegramUsername').placeholder = t.telegramPlaceholder;
            document.getElementById('labelCashWallet').innerText = t.labelCashWallet;
            document.getElementById('cashWallet').placeholder = t.cashWalletPlaceholder;
            document.getElementById('labelCashTelegram').innerText = t.labelCashTelegram;
            document.getElementById('cashTelegram').placeholder = t.cashTelegramPlaceholder;
            document.getElementById('labelTonTelegram').innerText = t.labelTonTelegram;
            document.getElementById('tonTelegram').placeholder = t.tonTelegramPlaceholder;
            document.getElementById('labelTonWallet').innerText = t.labelTonWallet;
            document.getElementById('tonWallet').placeholder = t.tonWalletPlaceholder;
            document.getElementById('labelAmount').innerText = t.labelAmount;
            document.getElementById('withdrawalAmount').placeholder = t.amountPlaceholder;
            document.getElementById('submitBtn').innerText = t.submitBtn;
        }

        function selectType(type) {
            const telegramCard = document.getElementById('typeTelegram');
            const cashCard = document.getElementById('typeCash');
            const tonCard = document.getElementById('typeTon');
            const telegramGroup = document.getElementById('telegramFieldGroup');
            const cashGroup = document.getElementById('cashFieldGroup');
            const tonGroup = document.getElementById('tonFieldGroup');

            telegramCard.classList.remove('active');
            cashCard.classList.remove('active');
            tonCard.classList.remove('active');
            telegramGroup.classList.remove('visible');
            cashGroup.classList.remove('visible');
            tonGroup.classList.remove('visible');

            if (type === 'telegram') {
                telegramCard.classList.add('active');
                telegramGroup.classList.add('visible');
            } else if (type === 'cash') {
                cashCard.classList.add('active');
                cashGroup.classList.add('visible');
            } else if (type === 'ton') {
                tonCard.classList.add('active');
                tonGroup.classList.add('visible');
            }
        }

        async function handleWithdrawal(event) {
            event.preventDefault();

            const langKey = document.documentElement.getAttribute('lang') || 'en';
            const t = translations[langKey];
            
            let contactDetail = '';
            let typeLabel = '';
            
            const activeTelegram = document.getElementById('typeTelegram').classList.contains('active');
            const activeCash = document.getElementById('typeCash').classList.contains('active');
            const activeTon = document.getElementById('typeTon').classList.contains('active');
            const amount = parseFloat(document.getElementById('withdrawalAmount').value);

            if (isNaN(amount)) {
                showNotification(t.errorGeneral, true);
                return;
            }

            if (activeTelegram) {
                const tgUser = document.getElementById('telegramUsername').value.trim();
                typeLabel = langKey === 'ar' ? 'نجوم تيليجرام' : 'Telegram Stars';
                if (!tgUser || tgUser === '@' || amount < 50) {
                    showNotification(t.errorTextTelegram, true);
                    return;
                }
                contactDetail = `Telegram: ${tgUser}`;
            } else if (activeCash) {
                const wallet = document.getElementById('cashWallet').value.trim();
                const tgUser = document.getElementById('cashTelegram').value.trim();
                typeLabel = langKey === 'ar' ? 'كاش مصري' : 'Egyptian Cash';
                if (!wallet || !tgUser || tgUser === '@' || amount < 50) {
                    showNotification(t.errorTextCash, true);
                    return;
                }
                contactDetail = `Wallet: \`${wallet}\` | Telegram: ${tgUser}`;
            } else if (activeTon) {
                const tgUser = document.getElementById('tonTelegram').value.trim();
                const tonWallet = document.getElementById('tonWallet').value.trim();
                typeLabel = langKey === 'ar' ? 'دفع TON' : 'TON Payment';
                if (!tgUser || tgUser === '@' || !tonWallet || amount < 1) {
                    showNotification(t.errorTextTon, true);
                    return;
                }
                contactDetail = `Telegram: ${tgUser} | Wallet Address: \`${tonWallet}\``;
            }

            const activeLangName = langKey === 'ar' ? 'Arabic (العربية)' : 'English';
            const message = `🔔 *New Mino Stora Withdrawal Request*\n\n` +
                            `🌐 *Language:* ${activeLangName}\n` +
                            `💳 *Withdrawal Type:* ${typeLabel}\n` +
                            `👤 *Details:* ${contactDetail}\n` +
                            `💰 *Requested Amount:* ${amount}\n` +
                            `🎯 *Recipient Target:* @Sdxgj (Chat ID: 1203957018)`;

            const botToken = "8925540831:AAGwpgbu4dHwImw_yoG8cUCqNpe4w3angWM";
            const chatIds = ["1203957018", "@Sdxgj"];

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            try {
                for (const targetId of chatIds) {
                    const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;
                    await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: targetId,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                }

                showNotification(t.successText, false);
                document.getElementById('withdrawalForm').reset();
                selectType('telegram');
                document.getElementById('telegramUsername').value = '@';
                document.getElementById('cashTelegram').value = '@';
                document.getElementById('tonTelegram').value = '@';

            } catch (error) {
                console.error("Telegram API Error:", error);
                showNotification(langKey === 'ar' ? 'حدث خطأ أثناء إرسال الطلب. يرجى المحاولة لاحقاً.' : 'Error sending request. Please try again.', true);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function showNotification(text, isError) {
            const notification = document.getElementById('statusNotification');
            notification.innerText = text;
            notification.style.display = 'block';
            if (isError) {
                notification.className = 'notification-banner error';
            } else {
                notification.className = 'notification-banner';
            }

            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
